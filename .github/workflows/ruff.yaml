name: Ruff

permissions: {}

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check --diff --output-format github
        if: ${{ !cancelled() }}

      - name: Check pre-commit hooks
        uses: j178/prek-action@v3.1.0
        with:
          extra-args: "--all-files --verbose"
