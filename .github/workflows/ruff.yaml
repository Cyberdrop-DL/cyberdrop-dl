name: Ruff

permissions: {}

on:
  push:
  pull_request:

jobs:
  ruff:
    name: Lint and format
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check --diff --output-format github
        if: ${{ !cancelled() }}
