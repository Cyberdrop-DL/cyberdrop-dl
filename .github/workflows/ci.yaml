name: CI

on:
  push:
    branches:
      - main
    paths:
      - "cyberdrop_dl/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "cyberdrop_dl/**/*.py"
      - "cyberdrop_dl/pyproject.toml"
      - "tests/**/*.py"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

# cancel any pending jobs of this action on new pushes to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYYAML_FORCE_LIBYAML: "0"

permissions: {}

jobs:
  type_check:
    timeout-minutes: 5
    permissions:
      contents: read

    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --no-build --all-extras

      - run: uvx basedpyright cyberdrop_dl --level error
        timeout-minutes: 5

  test:
    name: Run pytest
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.12, 3.14]
        include:
          - os: windows-11-arm
            python-version: 3.14
          - os: ubuntu-slim # Move to main matrix when pyyaml releases wheels
            python-version: 3.15
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --no-build --all-extras

      - name: Run pytest
        timeout-minutes: 10
        run: |
          uv run pytest --ignore=tests/test_ffmpeg.py -v
